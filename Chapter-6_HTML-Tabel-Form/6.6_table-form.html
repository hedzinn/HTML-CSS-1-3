<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Input Atibut,Checkbox & Radio</title>
</head>
<body>
    <h1>Contoh Input Atibut,Checkbox & Radio</h1>
    <form>
        <label for="name">Name : </label>
        <input type="text" name="text" id="text" placeholder="Masukkan nama"><br>
        <h2>Hobby:</h2>
        <input type="checkbox" name="Hobby1" id="Olahraga" value="Olahraga"><label for="Olahraga">Olahraga</label>
        <input type="checkbox" name="Hobby2" id="Coding" value="coding"><label for="coding">Coding</label>
        <h2>Jenis - Kelamin :</h2>
        <input type="radio" name="Gender" id="laki" value="laki"><label for="laki">Laki-Laki</label>
        <input type="radio" name="Gender" id="perempuan" value="perempuan"><label for="Gender">Perempuan</label><br>
        <select name="Kota" id="kota">
            <option value="#">--Nama Kota--</option>
            <option value="Kalimatan tengah">Palangkaraya</option>
            <option value="DIY">Yogjakarta</option>
            <option value="Jawa Barat">Bandung</option>
        </select>
        <textarea name="text" id="text" placeholder="Masukan text" rows="10" cols="30"></textarea>
        <input type="submit" value="Kirim !">
    </form>
</body>
</html>
