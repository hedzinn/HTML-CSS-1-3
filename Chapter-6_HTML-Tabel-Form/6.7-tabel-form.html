<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel & form</title>
</head>
<body>
    <h1>form & Table</h1>
    <table border="1" cellspacing="0" cellpadding="8">
        <tr>
            <td align="right"><label for="name">Name : </label></td>
            <td><input type="text" name="text" id="text" placeholder="Masukkan nama"></td>
        </tr>
        <tr>
            <td align="right"><label for="password">Password : </label></td>
            <td><input type="password" name="password" id="password"></td>
        </tr>
        <tr>
            <td align="right"><label for="email">Email : </label></td>
            <td><input type="email" name="email" id="email"></td>
        </tr>
        <tr>
            <td align="right"><label for="number">Number : </label></td>
            <td><input type="number" name="number" id="number"></td>
        </tr>
         <tr>
            <td><input type="checkbox" name="Hobby1" id="Olahraga" value="Olahraga"><label for="Olahraga">Olahraga</label></td>
            <td><input type="checkbox" name="Hobby2" id="Coding" value="coding"><label for="coding">Coding</label></td>
        </tr>
         <tr>
            <td><input type="radio" name="Gender" id="laki" value="laki"><label for="laki">Laki-Laki</label></td>
            <td><input type="radio" name="Gender" id="perempuan" value="perempuan"><label for="Gender">Perempuan</label></td>
        </tr>
         <tr>
            <td colspan="2" align="center"><select name="Kota" id="kota">
            <option value="#">--Nama Kota--</option>
            <option value="Kalimatan tengah">Palangkaraya</option>
            <option value="DIY">Yogjakarta</option>
            <option value="Jawa Barat">Bandung</option>
        </select></td>
        </tr>
        <tr>
            <td colspan="2"><textarea name="text" id="text" placeholder="Masukan text" rows="10" cols="30"></textarea></td>
        </tr>
    </table>
</body>
</html>
