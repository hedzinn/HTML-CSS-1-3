<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar magin table</title>
</head>
<body>
    <h1>Margin tabel html</h1>
    <br>
    <table border="1" cellspacing="0" cellpadding="8">
        <tr>
            <th>1,1</th>
            <th colspan="2">1,2</th>
        </tr>
        <tr>
            <td>2,1</td>
            <td>2,2</td>
            <td>2,3</td>
        </tr>
        <tr>
            <td>3,1</td>
            <td>3,2</td>
            <td>3,3</td>
        </tr>
    </table>
</body>
</html>
