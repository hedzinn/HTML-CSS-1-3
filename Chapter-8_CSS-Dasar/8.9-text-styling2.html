<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text style</title>
    <style>
        p{
            font-size: 26px;
            white-space: nowrap;
            width: 700px;
            background-color: yellowgreen;
            overflow:hidden;
            text-overflow: ellipsis;
        }
        h1{
            color: aliceblue;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 50px;
            text-shadow: 0px 5px 2px blueviolet;
        }
    </style>
</head>
<body>
    <h1>Hello world</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolore obcaecati molestiae tenetur sed laborum dicta sequi, mollitia saepe nesciunt fugit exercitationem beatae consequuntur atque numquam cum quaerat delectus maiores consectetur.</p>

</body>
</html>
