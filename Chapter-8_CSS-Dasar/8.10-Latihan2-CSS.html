<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muzin Quote</title>
    <style>
        h1{
           word-spacing: 20px;
            text-shadow: 5px 0px 5px rgb(80, 79, 81);
            font-size: 40px;
            margin: 50px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            text-transform: uppercase;
            text-decoration: underline;
            
            text-decoration-style: wavy;
        }
        p{
            line-height: 40px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 25px;
            word-spacing: 20px;
            font-weight: bold;
            text-align: center;
        }
        span{
            color: rgb(115, 115, 115);
            text-decoration: line-through;
        }
        cite{
            display: block;
            color: rgb(152, 152, 152);
            text-align: center;
            margin: 45px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 25px;
            word-spacing: 20px;
        }
    </style>
</head>
<body>
    <h1>kata - kata bijak</h1>
    <blockquote>
        <p>“Jangan berharap jalan hidupmu akan sama dengan <span>orang lain</span>. Setiap orang memiliki jalan kehidupan yang unik dan penyelesaian masalah yang berbeda-beda. Just be yourself.”</p>
        <cite>-Muzin wpu course </cite>
    </blockquote>
</body>
</html>
